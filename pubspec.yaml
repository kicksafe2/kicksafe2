name: kicksafe
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  camera: ^0.10.5+9
  image: ^4.1.7
  shared_preferences: ^2.3.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  flutter_naver_map: ^1.4.4
  geolocator: ^13.0.2
  http: ^1.2.2

# firebase_auth 4.16.0 은 platform_interface 7.0.x 와 짝이다. 더 새 7.3.x 가 같이 깔리면
# 회원가입/로그인 결과를 읽다가 "PigeonUserDetails" TypeError 가 나므로 7.0.9 로 고정한다.
dependency_overrides:
  firebase_auth_platform_interface: 7.0.9

flutter:
  uses-material-design: true
  assets:
    - lib/assets/model/model_unquant.tflite
    - lib/assets/model/labels.txt